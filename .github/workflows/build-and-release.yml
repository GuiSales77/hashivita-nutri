name: Build APK e publicar Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Necessário para o passo de Release criar a tag e anexar o APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Conferir se o projeto está linkado ao EAS
        # Sem extra.eas.projectId no app.json o `eas build --non-interactive`
        # falha, mas só depois de subir o projeto. Falhar aqui economiza tempo
        # e dá uma mensagem que diz o que fazer.
        run: |
          if ! node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "::error::app.json não tem extra.eas.projectId. Rode 'eas init' localmente e commite o app.json."
            exit 1
          fi

      - name: Criar .env a partir dos secrets
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env

      - name: Permitir que o EAS envie o .env
        # O EAS respeita o .gitignore ao empacotar o projeto — e o .env está
        # ignorado. Sem isso o .env criado acima NÃO sobe, as variáveis ficam
        # undefined no bundle e o app instala mas não fala com o Supabase.
        # Quando existe .easignore, ele substitui o .gitignore nessa decisão.
        run: grep -v '^\.env$' .gitignore > .easignore

      - name: Type-check antes de buildar
        # Se o código tiver erro de tipo, o build nem começa — não gasta cota
        # de build da Expo com código quebrado.
        run: npx tsc --noEmit

      - name: Build do APK na nuvem da Expo
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --profile preview --platform android --non-interactive --wait --json > build.json
          URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' build.json)
          if [ -z "$URL" ]; then
            echo "::error::O build terminou sem URL de artefato."
            cat build.json
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Baixar o APK gerado
        run: curl -fL --retry 3 -o hashivita-nutri.apk "${{ steps.build.outputs.url }}"

      - name: Conferir o APK antes de publicar
        id: apk
        # Um download truncado aqui viraria um Release que NENHUM celular
        # instala ("problema ao analisar o pacote"). Melhor falhar o workflow
        # do que publicar um arquivo quebrado. O resumo também vai para o
        # corpo do Release, para dar como conferir o arquivo baixado.
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import hashlib, os, re, struct, sys, zipfile
          caminho = 'hashivita-nutri.apk'
          tamanho = os.path.getsize(caminho)
          dados = open(caminho, 'rb').read()
          try:
              z = zipfile.ZipFile(caminho)
              if z.testzip() is not None:
                  raise zipfile.BadZipFile('entrada com CRC invalido')
              nomes = z.namelist()
          except zipfile.BadZipFile as e:
              print(f'::error::APK corrompido ou incompleto ({tamanho} bytes): {e}', file=sys.stderr)
              raise SystemExit(1)
          if 'AndroidManifest.xml' not in nomes:
              print('::error::APK sem AndroidManifest.xml', file=sys.stderr)
              raise SystemExit(1)
          if b'APK Sig Block 42' not in dados[-4_000_000:]:
              print('::error::APK sem bloco de assinatura', file=sys.stderr)
              raise SystemExit(1)
          abis = sorted({n.split('/')[1] for n in nomes if n.startswith('lib/')})
          print(f'tamanho={tamanho}')
          print(f'mb={tamanho / 1048576:.2f}')
          print(f'sha256={hashlib.sha256(dados).hexdigest()}')
          print(f'abis={",".join(abis)}')
          EOF

      - name: Publicar como GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "HashVita Nutri — build ${{ github.run_number }}"
          files: ./hashivita-nutri.apk
          body: |
            Build automático gerado a partir do commit ${{ github.sha }}.

            **Arquivo conferido antes de publicar**
            - Tamanho: `${{ steps.apk.outputs.mb }} MB` (`${{ steps.apk.outputs.tamanho }}` bytes)
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`
            - Arquiteturas: `${{ steps.apk.outputs.abis }}`
            - Android 7.0 ou mais novo (minSdk 24)

            **Como instalar**
            1. Baixe o `.apk` abaixo e confira se o tamanho baixado é o de cima.
               Se for menor, o download parou no meio — baixe de novo.
            2. Ative "instalar de fontes desconhecidas" para o app que abriu o
               arquivo (navegador ou gerenciador de arquivos), se o sistema pedir.
            3. **Se der "aplicativo não instalado"**, desinstale a versão
               anterior do HashVita antes de instalar esta. Android recusa a
               troca quando a instalação existente veio de um build assinado com
               outra chave.
